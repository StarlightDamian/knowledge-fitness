M讨论抗阻剂量；不保证任何固定周组数最适合所有人。","en":"ACSM addresses dose; no fixed weekly set total is best for everyone."}},{"source":"currier-2023","role":{"zh-CN":"网络荟萃分析比较处方组合；网络排序不等于个人最优。","en":"Network comparisons of prescriptions; rankings are not individual optima."}}],"auditLabel":{"zh-CN":"综述综合；不提供个人最优阈值","en":"Review synthesis; no individual optimum"}},{"id":"frequency","layer":"training","title":{"zh-CN":"频率服务于周计划","en":"Frequency serves the weekly plan"},"summary":{"zh-CN":"训练频率帮助分配总训练量；不是每天练同一部位才有效。","en":"Frequency distributes weekly work; daily training of the same region is not required."},"action":{"zh-CN":"全身计划可从每周2次非连续日开始，再按恢复调整。","en":"A full-body plan can start with two non-consecutive days and be adjusted."},"scope":{"zh-CN":"2天是实用起点，不是所有目标的唯一最优频率。","en":"Two days is a practical starting point, not a uniquely optimal frequency."},"sources":["who-2020","currier-2023"],"kind":"synthesis","goals":["hypertrophy","fat-loss"],"reviewStatus":"desk-reviewed; expert sign-off pending","checked":"2026-09-29","sourceRoles":[{"source":"who-2020","role":{"zh-CN":"WHO的至少2天是公共健康肌力目标。","en":"WHO’s two-day target is public-health guidance."}},{"source":"currier-2023","role":{"zh-CN":"抗阻频率与周处方结局；不能把公共健康基线当增肌唯一频率。","en":"Frequency and program outcomes; the public-health minimum is not the only hypertrophy schedule."}}],"auditLabel":{"zh-CN":"不同层面证据","en":"Evidence at different levels"}},{"id":"failure","layer":"training","title":{"zh-CN":"力竭不是每组必修课","en":"Failure is not mandatory on every set"},"summary":{"zh-CN":"长期适应不要求每组都练到无法再完成一次；力竭还会增加当次任务难度。","en":"Long-term adaptation does not require every set to reach inability to complete another repetition."},"action":{"zh-CN":"模板以保留2–3次可完成次数（RIR）作为起点；新手估计误差较大。","en":"Templates begin around 2–3 repetitions in reserve (RIR); novice estimates can be inaccurate."},"scope":{"zh-CN":"精确RIR起点是编辑实施规则；不是试验证实适合每个人。","en":"The exact RIR starting point is an editorial implementation rule, not individually validated."},"sources":["failure-2022","acsm-2026"],"kind":"synthesis","goals":["hypertrophy","fat-loss"],"reviewStatus":"desk-reviewed; expert sign-off pending","checked":"2026-09-29","sourceRoles":[{"source":"failure-2022","role":{"zh-CN":"力竭与非力竭对比的长期力量/肌肥大平均结局。","en":"Long-term strength and hypertrophy comparisons of failure/non-failure."}},{"source":"acsm-2026","role":{"zh-CN":"ACSM更新用于综合核对，可能纳入同一批原始研究。","en":"ACSM provides updated context and may incorporate the same original trials."}}],"auditLabel":{"zh-CN":"系统综述与更新综合；可能重叠","en":"Systematic and updated review; possible overlap"}},{"id":"progression","layer":"training","title":{"zh-CN":"先增加稳定表现，再增加重量","en":"Progress repeatable performance first"},"summary":{"zh-CN":"长期记录帮助分辨真实进步和偶然好状态；不同动作的公斤数不能直接合并为效果。","en":"Logs help distinguish repeatable progress from a good day; kilograms across tasks are not an effectiveness measure."},"action":{"zh-CN":"达到次数上限且动作稳定后，尝试器材允许的最小增量；不适则回退。","en":"After reaching the repetition ceiling with control, try the smallest available increment; regress if poorly tolerated."},"scope":{"zh-CN":"双进阶是本项目采用的执行策略，不是唯一正确方法。","en":"Double progression is this project’s implementation choice, not the only valid method."},"sources":["acsm-2026","currier-2023"],"kind":"synthesis","goals":["hypertrophy","fat-loss"],"reviewStatus":"desk-reviewed; expert sign-off pending","checked":"2026-09-29","sourceRoles":[{"source":"acsm-2026","role":{"zh-CN":"训练刺激与渐进的原则依据。","en":"Principles for stimulus and progression."}},{"source":"currier-2023","role":{"zh-CN":"处方比较提供剂量背景；本网站双进阶规则不是该研究直接验证的算法。","en":"Prescription comparisons supply dose context; this site’s double-progression rule was not directly validated by that review."}}],"auditLabel":{"zh-CN":"原则依据 + 编辑进阶规则","en":"Evidence-informed principle + editorial rule"}},{"id":"range","layer":"training","title":{"zh-CN":"记录可控活动范围","en":"Log controlled range of motion"},"summary":{"zh-CN":"动作行程属于训练剂量的一部分；缩短行程后的加重不一定是同一任务的进步。","en":"Range of motion is part of the task; adding load with shorter range is not d":"concurrent","layer":"training","title":{"zh-CN":"有氧不必从增肌计划里删除","en":"Do not automatically remove cardio"},"summary":{"zh-CN":"并行训练对肌肉量、最大力量和爆发力的影响不是同一个问题。","en":"Concurrent training has distinct implications for muscle size, maximal strength and explosive strength."},"action":{"zh-CN":"把最重视的任务安排在精力较好时；高疲劳任务可分开。","en":"Schedule the priority task when fresh; separate highly fatiguing sessions where useful."},"scope":{"zh-CN":"爆发力运动员的安排不能直接套用普通健身者。","en":"Power-athlete scheduling should not be directly imposed on recreational trainees."},"sources":["concurrent-2022","who-2020"],"kind":"synthesis","goals":["hypertrophy","fat-loss"],"reviewStatus":"desk-reviewed; expert sign-off pending","checked":"2026-09-29","sourceRoles":[{"source":"concurrent-2022","role":{"zh-CN":"同时训练的平均肌肥大/最大力量结果；爆发力与同节安排可能不同。","en":"Average concurrent-training outcomes; explosive strength and same-session scheduling can differ."}},{"source":"who-2020","role":{"zh-CN":"同时保留有氧和肌力的公共健康理由；不等于证明无任何干扰。","en":"Public-health rationale for both modalities; not proof of zero interference."}}],"auditLabel":{"zh-CN":"系统综述 + 公共健康范围","en":"Systematic review + public-health context"}},{"id":"fat-loss","layer":"nutrition","title":{"zh-CN":"减脂不靠一台“燃脂神器”","en":"Fat loss is not a machine feature"},"summary":{"zh-CN":"饮食习惯和活动共同影响体重管理；单次器材热量显示不能证明长期减脂效果。","en":"Dietary habits and activity jointly influence weight management; one machine calorie display cannot establish long-term fat loss."},"action":{"zh-CN":"先改变可持续的饮食和活动习惯，结合多周体重、围度和表现观察。","en":"Make sustainable food/activity changes and observe multi-week weight, circumference and performance."},"scope":{"zh-CN":"不提供极低热量、速瘦承诺或局部减脂处方。","en":"No very-low-calorie prescriptions, rapid-loss promises or spot-fat-loss prescriptions."},"sources":["nhs-weight","aerobic-2024"],"kind":"synthesis","goals":["fat-loss"],"reviewStatus":"desk-reviewed; expert sign-off pending","checked":"2026-09-29","sourceRoles":[{"source":"nhs-weight","role":{"zh-CN":"NHS说明可持续饮食和活动的管理方向。","e  aerobic time separately rather than cutting warm-up or resistance rest."},"stop":{"zh-CN":"出现胸痛、晕厥、异常呼吸困难、神经症状或明显疼痛时停止，不用完成计划优先于安全。","en":"Stop for chest pain, fainting, unusual breathlessness, neurological symptoms or significant pain; completing a plan never takes priority over safety."},"sources":["resistance-obesity","aerobic-2024","who-2020"],"evidenceScope":{"zh-CN":"依据原则编排的示例，不是该整套计划经过随机试验验证；仅用于无已知限制的18–64岁成人。","en":"An editorial implementation of evidence-based principles, not a trial-validated complete program; for adults 18–64 without known limitations."},"reviewStatus":"editorial template; coach and clinician review pending"},{"id":"fat-no-gear","name":{"zh-CN":"无器材活动起步 · 2天","en":"No-equipment movement starter · 2 days"},"goal":"fat-loss","days":2,"minutes":30,"level":"beginner","settings":["home","outdoor"],"sessions":[{"label":"A","exercises":[{"exercise":"squat","sets":2,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"wall-push","sets":2,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"bridge","sets":2,"reps":"8–12","rir":"2–3","restSeconds":120}],"cardioMinutes":10,"cardioExercise":"walk"},{"label":"B","exercises":[{"exercise":"split-squat","sets":2,"reps":"8–12 / side","rir":"2–3","restSeconds":120},{"exercise":"wall-push","sets":2,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"bird-dog","sets":2,"reps":"6–10 / side","rir":"2–3","restSeconds":60}],"cardioMinutes":10,"cardioExercise":"walk"}],"notes":{"zh-CN":"局限：缺少有负荷的背部拉动，不是完整增肌计划。先建立习惯，再加长带或哑铃。","en":"Limitation: no loaded back-pulling pattern; not a complete hypertrophy program. Build the habit, then consider a long band or dumbbells."},"partial":true,"warmup":{"zh-CN":"每次先预留5–8分钟轻活动和动作热身；热身组不计入工作组。","en":"Allow 5–8 minutes for easy activity and task-specific warm-up; warm-up sets are not work sets."},"progression":{"zh-CN":"先在稳定可控的行程内达到次数上限，再小幅调整徒手动作难度，例如墙面俯卧撑的站位；每次只改一项，并保持约2–3次余力。动作控制变差时回退难度或减少一组。有氧先以可持续的谈话强度完成当前时间；适应且恢复良好后，在可用时长内少量增加分钟数，不同时提高强度。若需更多周有氧量，另行安排时间，不挤掉热身或抗阻组间休息。","en":"Reach the rep ceiling through a stable controlled range before adjusting a bodyweight variation, such as stance distance for wall push-ups. Change one thing at a time and keep about 2–3 reps in reserve. Regress difficulty or remove a set if control declines. For aerobic work, first complete the current duration at a sustainable conversational effort. Once comfortable and recovering well, add a few minutes within available time without also increasing intensity. Schedule extra weekly aerobic time separately rather than cutting warm-up or resistance rest."},"stop":{"zh-CN":"出现胸痛、晕厥、异常呼吸困难、神经症状或明显疼痛时停止，不用完成计划优先于安全。","en":"Stop for chest pain, fainting, unusual breathlessness, neurological symptoms or significant pain; completing a plan never takes priority over safety."},"sources":["resistance-obesity","aerobic-2024","who-2020"],"evidenceScope":{"zh-CN":"依据原则编排的示例，不是该整套计划经过随机试验验证；仅用于无已知限制的18–64岁成人。","en":"An editorial implementation of evidence-based principles, not a trial-validated complete program; for adults 18–64 without known limitations."},"reviewStatus":"editorial template; coach and clinician review pending"},{"id":"fat-walk-cycle","name":{"zh-CN":"有氧起步 · 骑行3天","en":"Aerobic starter · Cycling 3 days"},"goal":"fat-loss","days":3,"minutes":30,"level":"beginner","settings":["home","gym"],"sessions":[{"label":"A","exercises":[],"cardioMinutes":20,"cardioExercise":"bike"},{"label":"B","exercises":[],"cardioMinutes":20,"cardioExercise":"bike"},{"label":"C","exercises":[],"cardioMinutes":20,"cardioExercise":"bike"}],"notes":{"zh-CN":"每周60分钟骑行仅为有氧起点，尚未覆盖公共健康建议量；缺少抗阻模块，不能替代完整体能计划。","en":"The 60 weekly cycling minutes are an aerobic starting point, below public-health guidance; this lacks resistance work and is not a complete fitness plan."},"partial":true,"warmup":{"zh-CN":"每次先轻松骑行5分钟，结束前再轻松骑行数分钟；都计入30分钟总时长。","en":"Start with 5 minutes of easy pedaling and finish with a few easy minutes; both count toward the 30-minute session budget."},"progression":{"zh-CN":"先以可持续的谈话强度完成每次20分钟，必要时缩短并分段。适应且恢复良好后，在30分钟总时长内少量增加骑行分钟数，保留热身与轻松收尾，不同时提高强度；超过预算的有氧量另行安排。恢复不佳时缩短时间或降低强度。","en":"First build toward 20 minutes at a sustainable conversational effort; shorten or split it if needed. Once comfortable and recovering well, add a few minutes within the 30-minute session budget, keeping warm-up and an easy finish. Do not also increase intensity; schedule additional duration separately. Reduce duration or intensity if recovery is poor."},"stop":{"zh-CN":"出现胸痛、晕厥、异常呼吸困难、神经症状或明显疼痛时停止，不用完成计划优先于安全。","en":"Stop for chest pain, fainting, unusual breathlessness, neurological symptoms or significant pain; completing a plan never takes priority over safety."},"sources":["resistance-obesity","aerobic-2024","who-2020"],"evidenceScope":{"zh-CN":"依据原则编排的示例，不是该整套计划经过随机试验验证；仅用于无已知限制的18–64岁成人。","en":"An editorial implementation of evidence-based principles, not a trial-validated complete program; for adults 18–64 without known limitations."},"reviewStatus":"editorial template; coach and clinician review pending"},{"id":"muscle-db-upper-lower","name":{"zh-CN":"家用哑铃上下肢 · 4天","en":"Home dumbbell upper / lower · 4 days"},"goal":"hypertrophy","days":4,"minutes":50,"level":"intermediate","settings":["home","gym"],"sessions":[{"label":"Upper A","exercises":[{"exercise":"db-floor","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-row","sets":3,"reps":"8–12 / side","rir":"2–3","restSeconds":120},{"exercise":"db-press","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-curl","sets":3,"reps":"8–12","rir":"2–3","restSeconds":60}],"cardioMinutes":0,"cardioExercise":null},{"label":"Lower A","exercises":[{"exercise":"goblet","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-rdl","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-lunge","sets":3,"reps":"8–12 / side","rir":"2–3","restSeconds":120},{"exercise":"calf-raise","sets":3,"reps":"10–15","rir":"2–3","restSeconds":60}],"cardioMinutes":0,"cardioExercise":null},{"label":"Upper B","exercises":[{"exercise":"db-floor","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-row","sets":3,"reps":"8–12 / side","rir":"2–3","restSeconds":120},{"exercise":"db-lateral","sets":3,"reps":"10–15","rir":"2–3","restSeconds":60},{"exercise":"db-curl","sets":3,"reps":"8–12","rir":"2–3","restSeconds":60}],"cardioMinutes":0,"cardioExercise":null},{"label":"Lower B","exercises":[{"exercise":"goblet","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-rdl","sets":3,"reps":"8–12","rir":"2–3","restSeconds":120},{"exercise":"db-lunge","sets":3,"reps":"8–12 / side","rir":"2–3","restSeconds":120},{"exercise":"calf-raise","sets":3,"reps":"10–15","rir":"2–3","restSeconds":60}],"cardioMinutes":0,"cardioExercise":null}],"notes":{"zh-CN":"双侧和单侧练习结合；负荷上限不足时可能需要升级器材，而非无限加次数。","en":"Combines bilateral and unilateral work; limited available load may eventually require different equipment."},"partial":false,"warmup":{"zh-CN":"每次先预留5–8分钟轻活动和动作热身；热身组不计入工作组。","en":"Allow 5–8 minutes for easy activity and task-specific warm-up; warm-up sets are not work sets."},"progression":{"zh-CN":"前两次从较轻负荷与低组数开始。两次训练均能在可控行程内达到次数上限，且仍有约2次余力时，尝试最小加重；恢复不佳则减少一组或回退负荷。","en":"Begin the first two sessions with light loads and low set counts. After two controlled sessions at the rep ceiling with about two reps left, try the smallest load increase. With poor recovery, remove a set or regress load."},"stop":{"zh-CN":"出现胸痛、晕厥、异常呼吸困难、神经症状或明显疼痛时停止，不用完成计划优先于安全。","en":"Stop for chest pain, fainting, unusual breathlessness, neurological symptoms or significant pain; completing a plan never takes priority over safety."},"sources":["acsm-2026","currier-2023"],"evidenceScope":{"zh-CN":"依据原则编排的示例，不是该整套计划经过随机试验验证；仅用于无已知限制的18–64岁成人。","en":"An editorial implementation of evidence-based principles, not a trial-validated complete program; for adults 18–64 without known limitations."},"reviewStatus":"editorial template; coach and clinician review pending"}],"methods":[{"id":"straight","name":{"zh-CN":"传统直组","en":"Straight sets"},"definition":{"zh-CN":"一次动作完成全部工作组再换动作。","en":"Finish the work sets for one exercise before moving on."},"use":{"zh-CN":"最容易记录与核对进步，是默认安排。","en":"Simple to log and audit; the default arrangement."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"fullbody","name":{"zh-CN":"全身安排","en":"Full-body scheduling"},"definition":{"zh-CN":"在一次训练内涵盖多个大肌群。","en":"Train multiple major regions within a session."},"use":{"zh-CN":"适合可用天数少的安排，不意味着每次练到力竭。","en":"Useful with limited weekly days; does not require training to failure."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"split","name":{"zh-CN":"上下肢 / 分化安排","en":"Upper/lower and split scheduling"},"definition":{"zh-CN":"把周训练量分配到不同天。","en":"Distribute weekly work across different days."},"use":{"zh-CN":"先确认实际出勤，不因名字更高级而采用。","en":"Use only when attendance supports it, not because it sounds advanced."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"double","name":{"zh-CN":"双进阶","en":"Double progression"},"definition":{"zh-CN":"先在次数区间内进步，再小幅加重。","en":"Progress within a rep range, then add a small load."},"use":{"zh-CN":"固定行程与RIR，避免以动作缩水换次数。","en":"Keep range and RIR comparable instead of shortening the task."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"superset","name":{"zh-CN":"超级组","en":"Supersets"},"definition":{"zh-CN":"两项动作相邻安排，再休息。","en":"Pair two exercises before resting."},"use":{"zh-CN":"节时策略；不在技术敏感的大重量动作上盲目省休息。","en":"A time-management choice; do not indiscriminately shorten rest for heavy technical lifts."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"circuit","name":{"zh-CN":"循环训练","en":"Circuit training"},"definition":{"zh-CN":"按顺序完成多动作站点。","en":"Move through a sequence of exercise stations."},"use":{"zh-CN":"心肺限制可能先于目标肌肉，需明确目标。","en":"Breathing demands can limit work before the target muscles do; clarify the goal."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"drop","name":{"zh-CN":"递减组","en":"Drop sets"},"definition":{"zh-CN":"一组后降低负荷继续。","en":"Reduce load after a set and continue."},"use":{"zh-CN":"可增加疲劳，不是新手默认，也不证明更优。","en":"Can increase fatigue; not a novice default or proof of superiority."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"restpause","name":{"zh-CN":"休息暂停组","en":"Rest-pause sets"},"definition":{"zh-CN":"短暂停顿后继续同动作。","en":"Continue the same exercise after a brief pause."},"use":{"zh-CN":"高疲劳技巧，不自动加入推荐计划。","en":"A fatiguing technique; not automatically included in recommendations."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"tempo","name":{"zh-CN":"节奏控制","en":"Tempo control"},"definition":{"zh-CN":"规定抬起、停顿与放下节奏。","en":"Specify lifting, pauses and lowering cadence."},"use":{"zh-CN":"用于可控性与任务一致；秒数本身不是效果排名。","en":"Useful for control and consistency; cadence alone is not an effectiveness ranking."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"isometric","name":{"zh-CN":"等长训练","en":"Isometrics"},"definition":{"zh-CN":"在相对固定关节位置发力。","en":"Produce force at a relatively fixed joint position."},"use":{"zh-CN":"适应有角度与任务特异性；康复应用需专业安排。","en":"Adaptation is angle/task-specific; rehabilitation use needs professional planning."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"continuous","name":{"zh-CN":"持续有氧","en":"Continuous aerobic work"},"definition":{"zh-CN":"以可持续强度连续活动。","en":"Maintain a sustainable aerobic effort."},"use":{"zh-CN":"起点易执行，可依据时间和偏好选择方式。","en":"An accessible starting format chosen around time and preference."},"sources":["who-2020","aerobic-2024"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"interval","name":{"zh-CN":"间歇有氧","en":"Aerobic intervals"},"definition":{"zh-CN":"较高与较低强度交替。","en":"Alternate higher and lower efforts."},"use":{"zh-CN":"不是减脂必需；先有基础耐受再考虑高强度。","en":"Not required for fat loss; establish tolerance before high intensity."},"sources":["who-2020","aerobic-2024"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"power","name":{"zh-CN":"爆发力训练","en":"Power training"},"definition":{"zh-CN":"强调快速发力或快速完成特定任务。","en":"Emphasize rapid force or task execution."},"use":{"zh-CN":"不是增肌模板的默认替代；落地、技术和恢复重要。","en":"Not a default substitute for hypertrophy work; landing, skill and recovery matter."},"sources":["acsm-2026","currier-2023"],"reviewStatus":"editorial definitions; not superiority claims"},{"id":"bfr","name":{"zh-CN":"血流限制训练","en":"Blood-flow restriction training"},"definition":{"zh-CN":"利用专用袖带限制局部血流的训练方式。","en":"Training using specialized cuffs to restrict local blood flow."},"use":{"zh-CN":"本版仅介绍概念，不提供缠带压力或自制操作；需合格人员。","en":"Concept only; no DIY cuff pressures or wrapping instructions. Requires qualified supervision."},"sources":["bfr-2019","acsm-2026"],"reviewStatus":"editorial definitions; not superiority claims"}],"populations":[{"id":"healthy","name":{"zh-CN":"健康成人新手","en":"Healthy adult beginner"},"knowledge":["start","frequency","failure"],"advice":{"zh-CN":"先学习动作与记录，选择器材齐备且时间可执行的模板。","en":"Learn movements and logging; choose a feasible template with the required equipment."},"route":"screen-first"},{"id":"trained","name":{"zh-CN":"已有训练经验","en":"Experienced adult"},"knowledge":["volume","progression","rest"],"advice":{"zh-CN":"按弱项、目标与恢复分配训练，不因级别更高而无限加量。","en":"Allocate work to goals and recovery, not unlimited volume because of experience."},"route":"screen-first"},{"id":"overweight","name":{"zh-CN":"超重 / 肥胖","en":"Overweight / obesity"},"knowledge":["fat-loss","retain-muscle","bmi"],"advice":{"zh-CN":"先考虑可执行性、关节耐受、伴随疾病与体成分指标。","en":"Consider feasibility, joint tolerance, associated conditions and composition outcomes."},"route":"education-only"},{"id":"older","name":{"zh-CN":"65岁及以上","en":"Adults 65+"},"knowledge":["older","accessibility"],"advice":{"zh-CN":"加入平衡与功能；本版只提供教育分流，不生成自动处方。","en":"Include balance and function; educational routing only in this release."},"route":"education-only"},{"id":"young","name":{"zh-CN":"儿童青少年","en":"Children / adolescents"},"knowledge":["youth"],"advice":{"zh-CN":"保护生长与技能发展；不使用成人减脂及BMI阈值。","en":"Protect development and skills; do not use adult fat-loss plans or BMI thresholds."},"route":"education-only"},{"id":"pregnant","name":{"zh-CN":"孕期 / 产后","en":"Pregnancy / postpartum"},"knowledge":["pregnancy"],"advice":{"zh-CN":"先根据产科评估和症状适配，不自动推荐减脂。","en":"Adapt to obstetric assessment and symptoms; no automatic fat-loss recommendation."},"route":"education-only"},{"id":"metabolic","name":{"zh-CN":"糖尿病与代谢疾病","en":"Diabetes / metabolic disease"},"knowledge":["diabetes"],"advice":{"zh-CN":"用药和并发症必须纳入，不在线调药。","en":"Account for medication and complications; no online medication changes."},"route":"education-only"},{"id":"cardiorenal","name":{"zh-CN":"心血管 / 肾脏疾病","en":"Cardiovascular / renal disease"},"knowledge":["diabetes","pain-gate"],"advice":{"zh-CN":"交由相关专业人员明确运动限制、监测与营养要求。","en":"A relevant professional should establish limits, monitoring and nutrition needs."},"route":"education-only"},{"id":"injury","name":{"zh-CN":"疼痛 / 损伤 / 术后","en":"Pain / injury / postoperative"},"knowledge":["pain-gate","back-pain","joint-pain"],"advice":{"zh-CN":"先分流和明确诊断；不从部位关键词直接套康复动作。","en":"Triage and clarify diagnosis; do not prescribe rehab from a body-part keyword."},"route":"education-only"},{"id":"disability","name":{"zh-CN":"残障 / 活动受限","en":"Disability / limited mobility"},"knowledge":["accessibility"],"advice":{"zh-CN":"按可达性、支撑、转移与个体能力适配，不用统一模板。","en":"Adapt reach, support, transfers and individual ability rather than using one template."},"route":"education-only"},{"id":"returning","name":{"zh-CN":"停训回归 / 久坐","en":"Returning / sedentary"},"knowledge":["return","start"],"advice":{"zh-CN":"按当前能力回归，既往伤病另行评估。","en":"Resume at current capacity; previous injuries need separate assessment."},"route":"screen-first"},{"id":"eating","name":{"zh-CN":"进食障碍风险 / 体重焦虑","en":"Eating-disorder risk / weight distress"},"knowledge":["fat-loss","pain-gate"],"advice":{"zh-CN":"关闭自动减脂和体重追踪，优先合格专业支持。","en":"Do not use automatic fat-loss plans or weight tracking; prioritize qualified support."},"route":"education-only"}],"sources":[{"id":"acsm-2026","title":"Resistance Training Prescription for Muscle Function, Hypertrophy, and Physical Performance in Healthy Adults: An Overview of Reviews","publisher":"ACSM / Medicine & Science in Sports & Exercise","year":2026,"url":"https://pubmed.ncbi.nlm.nih.gov/41843416/","doi":"10.1249/MSS.0000000000003897","type":"overview-of-reviews","scope":"Healthy adults; class-level training prescription, not device certification.","access":"indexed abstract + official ACSM summary","checked":"2026-09-29","reviewStatus":"desk-reviewed; independent expert review pending","overlap":"Includes prior reviews; not statistically independent of currier-2023 or failure-2022.","documentKey":"10.1249/mss.0000000000003897"},{"id":"who-2020","title":"World Health Organization 2020 guidelines on physical activity and sedentary behaviour","publisher":"WHO / British Journal of Sports Medicine","year":2020,"url":"https://bjsm.bmj.com/content/54/24/1451","doi":"10.1136/bjsports-2020-102955","type":"guideline","scope":"Children, adults, older adults, pregnancy/postpartum, chronic conditions and disability.","access":"official guideline summary / indexed journal text","checked":"2026-09-29","reviewStatus":"desk-reviewed; independent expert review pending","overlap":"","documentKey":"10.1136/bjsports-2020-102955"},{"id":"cdc-activity","title":"Adult Activi 'use strict';
/** Pure, dependency-free functions shared by the browser and Node tests. */
const VERSION = '1.0.0';
const REVIEW_DATE = '2026-09-29';
function text(value, lang = 'zh-CN') {
  if (typeof value === 'string') return value;
  return value?.[lang] ?? value?.[lang === 'zh-TW' ? 'zh-CN' : 'en'] ?? value?.['zh-CN'] ?? '';
}
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(value) {
  return String(value ?? '').normalize('NFKD').replace(/[\u0300-\u036f\u064b-\u065f\u0670]/g,'').normalize('NFC').toLowerCase().trim();
}
const ALIASES = {
  '哑铃':'dumbbell','啞鈴':'dumbbell','mancuerna':'dumbbell','mancuernas':'dumbbell','halteres':'dumbbell','hanteln':'dumbbell','ダンベル':'dumbbell','덤벨':'dumbbell','гантели':'dumbbell','دمبل':'dumbbell','डम्बल':'dumbbell',
  '杠铃':'barbell','槓鈴':'barbell','barra':'barbell','langhantel':'barbell','バーベル':'barbell','штанга':'barbell',
  '跑步机':'treadmill','跑步機':'treadmill','cinta de correr':'treadmill','tapis de course':'treadmill','laufband':'treadmill','トレッドミル':'treadmill','런닝머신':'treadmill',
  '弹力带':'band','彈力帶':'band','banda':'band','elastique':'band','widerstandsband':'band','チューブ':'band','밴드':'band',
  '划船机':'rower','划船機':'rower','rameur':'rower','rudergerat':'rower','ローイング':'rower',
  '胸':'chest','背':'back','腿':'leg','增肌':'hypertrophy','減脂':'fat loss','减脂':'fat loss','减肥':'fat loss','筋肥大':'hypertrophy','musculation':'hypertrophy','muskelaufbau':'hypertrophy','hipertrofia':'hypertrophy','근비대':'hypertrophy','гипертрофия':'hypertrophy','تضخيم':'hypertrophy','脂肪減少':'fat loss','perte de graisse':'fat loss','fettabbau':'fat loss','perdida de grasa':'fat loss','perda de gordura':'fat loss','체지방':'fat loss','снижение веса':'fat loss'
};
function expandedQuery(query) {
  const q=normalize(query); const additions=[];
  for(const [k,v] of Object.entries(ALIASES)) if(q.includes(normalize(k))) additions.push(v);
  return [q,...additions].join(' ');
}
function queryIntent(query) {
  const q=expandedQuery(query);
  let goal=null;
  if(/hypertrophy|muscle gain|build muscle|增肌/.test(q)) goal='hypertrophy';
  if(/fat loss|weight loss|lose weight|减脂|减肥/.test(q)) goal='fat-loss';
  let days=null, minutes=null;
  const d=q.match(/(?:每周\s*)?([2-7])\s*(?:天|days?|日)/);
  if(d) days=Number(d[1]);
  const cn=q.match(/每周([二三四五六七两])天/); if(cn)days={'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'两':2}[cn[1]];
  const m=q.match(/(\d{1,3})\s*(?:分钟|分鐘|min(?:ute)?s?|分)(?!\w)/); if(m)minutes=Number(m[1]);
  return {goal,days,minutes};
}
function searchItems(items, query, limit = 120) {
  const q=normalize(query); if(!q)return items.slice(0,limit);
  const expanded=expandedQuery(q);
  const terms=[...new Set(expanded.split(/\s+/).filter(Boolean))];
  return items.map(item=>{
    const localized=v=>typeof v==='string'?[v]:Object.values(v||{});
    const fields=[item.id,...localized(item.name||item.title),...(item.aliases||[]),...(item.patterns||[]),...(item.regions||[]),...Object.values(item.summary||{}),...Object.values(item.use||{})];
    const names=normalize([item.id,...localized(item.name||item.title),...(item.aliases||[])].join(' '));
    const all=normalize(fields.join(' '));
    let score=names===q?100:0;
    if(names.includes(q))score+=30;
    for(const term of terms) {if(names.includes(term))score+=8;else if(all.includes(term))score+=2;}
    return {item,score};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score||a.item.id.localeCompare(b.item.id)).slice(0,limit).map(r=>r.item);
}
/** Free text is an additional conservative trigger, never a clinical clearance. */
function textRisk(query='') {
  const q=normalize(query);
  if(/胸痛|胸闷|晕厥|昏厥|大小便失禁|会阴麻木|胸の痛み|意識消失|가슴\s*통증|胸痛|боль в груди|боли в груди|الم الصدر|ألم الصدر|सीने में दर्द|chest pain|fainting|loss of bladder|saddle numbness|douleur thoracique|dolor de pecho|dor no peito|brustschmerz/.test(q))return 'urgent';
  if(/膝痛|膝盖疼|腰痛|背痛|疼痛|受伤|术后|怀孕|孕期|妊娠|产后|糖尿病|心脏病|肾病|摂食障害|痛み|임신|통증|беремен|травм|حامل|اصابة|إصابة|गर्भवती|diabet|pregnan|postpartum|post.?operat|injury|knee pain|back pain|eating disorder|kidney disease|heart disease|dolor|douleur|schmerz/.test(q))return 'review';
  if(/(?:^|\W)(?:pain|injured)(?:\W|$)/.test(q)) return 'review';
  return 'none';
}
function safetyGate(profile={},query='') {
  const r=textRisk(query);
  if(profile.urgent==='yes'||r==='urgent')return {status:'urgent',reason:'urgent'};
  const age=Number(profile.age);
  if(profile.age===''||profile.age==null||!Number.isFinite(age)||age<1||age>120)return {status:'incomplete',reason:'age'};
  if(age<18)return {status:'review',reason:'under18'};
  if(age>=65)return {status:'review',reason:'older'};
  if(r==='review')return {status:'review',reason:'query'};
  if(profile.health && !['healthy','unknown'].includes(profile.health))return {status:'review',reason:profile.health};
  if(profile.urgent!=='no'||profile.health!=='healthy')return {status:'incomplete',reason:'screen'};
  return {status:'eligible',reason:'screened-template-only'};
}
function exerciseAvailable(exercise,equipment) {
  const set=new Set(equipment||[]);
  return exercise.equipmentOptions.some(option=>option.every(id=>set.has(id)));
}
function resolveExercises(plan, exercises, equipment) {
  const map=new Map(exercises.map(x=>[x.id,x]));
  const ids=[...new Set(plan.sessions.flatMap(s=>[...s.exercises.map(e=>e.exercise),...(s.cardioExercise?[s.cardioExercise]:[])]))];
  return ids.map(id=>({id,exercise:map.get(id),available:map.has(id)&&exerciseAvailable(map.get(id),equipment)}));
}

function recommend(plans,exercises,profile,query='') {
  const gate=safetyGate(profile,query);
  if(gate.status!=='eligible')return {gate,results:[],excluded:[]};
  const intent=queryIntent(query);
  const goal=intent.goal||profile.goal;
  const days=Math.min(Number(profile.days),intent.days??Infinity);
  const minutes=Math.min(Number(profile.minutes),intent.minutes??Infinity);
  if(!['hypertrophy','fat-loss'].includes(goal)||!Number.isFinite(days)||days<2||days>7||!Number.isFinite(minutes)||minutes<10||minutes>240||!['home','gym','outdoor'].includes(profile.place)||!['beginner','intermediate'].includes(profile.level))return {gate:{status:'incomplete',reason:'constraints'},results:[],excluded:[]};
  const excluded=[],results=[];
  for(const plan of plans) {
    if(plan.goal!==goal)continue;
    const reasons=[];
    if(plan.days>days)reasons.push('days');
    if(plan.minutes>minutes)reasons.push('minutes');
    if(!plan.settings.includes(profile.place))reasons.push('place');
    if(profile.level==='beginner'&&plan.level==='intermediate')reasons.push('level');
    const missing=resolveExercises(plan,exercises,profile.equipment).filter(x=>!x.available);
    if(missing.length)reasons.push('equipment');
    if(reasons.length)excluded.push({plan,reasons,missing:missing.map(x=>x.id)});
    else results.push({plan,reasons:['goal','time','place','equipment',...(plan.partial?['partial']:['resistance'])]});
  }
  // Prefer non-partial coverage and available frequency, not maximal volume or harder workouts.
  results.sort((a,b)=>Number(a.plan.partial)-Number(b.plan.partial)||Math.abs(days-a.plan.days)-Math.abs(days-b.plan.days)||a.plan.minutes-b.plan.minutes||a.plan.id.localeCompare(b.plan.id));
  return {gate,results,excluded,intent:{goal,days,minutes}};
}
function toCSV(rows,columns) {
  const cell=value=>{
    let s=String(value??'');
    if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s; // spreadsheet formula injection defense
    return '"'+s.replace(/"/g,'""')+'"';
  };
  return '\uFEFF'+[columns.map(c=>cell(c.label)).join(','),...rows.map(row=>columns.map(c=>cell(typeof c.value==='function'?c.value(row):row[c.value])).join(','))].join('\r\n');
}
function safeURL(value) {

}
function validDate(value) {

}
function validateLog(raw,today=localDate()) {
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return {valid:false,errors:['record'],record:null};
  const errors=[],record={date:String(raw.date||''),exercise:String(raw.exercise||'').slice(0,100)};
  if(!validDate(record.date)||record.date>today)errors.push('date');
  const limits={weight:[20,500],waist:[30,250],load:[0,1000],sets:[1,100],reps:[1,200],rir:[0,20],duration:[1,600],rpe:[0,10],sleepHours:[0,24]};
  for(const [key,[lo,hi]] of Object.entries(limits)) {
    const v=raw[key];record[key]=(v===''||v==null)?null:Number(v);
    if(record[key]!==null&&(!Number.isFinite(record[key])||record[key]<lo||record[key]>hi||(['sets','reps'].includes(key)&&!Number.isInteger(record[key]))))errors.push(key);
  }
  if(Object.keys(limits).every(k=>record[k]===null))errors.push('empty');

function bmi(weight,heightCm) {
  const w=Number(weight),h=Number(heightCm);
  if(!Number.isFinite(w)||!Number.isFinite(h)||w<20||w>500||h<100||h>250)throw new RangeError('Check kilograms and centimeters.');
  return w/(h/100)**2;
}
function weightSummary(records,anchor=localDate()) {
  if(!validDate(anchor))throw new RangeError('Invalid anchor date');
  const end=Date.parse(anchor+'T00:00:00Z');
  const daily=new Map();
  // For repeated entries on one day use the mean, so a busy logging day is not overweighted.
  for(const r of records)if(validDate(r.date)&&typeof r.weight==='number'&&Number.isFinite(r.weight)&&r.weight>=20&&r.weight<=500&&r.date<=anchor){
    if(!daily.has(r.date))daily.set(r.date,[]);daily.get(r.date).push(r.weight);
  }
  const days=[...daily].map(([date,v])=>({date,weight:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>a.date.localeCompare(b.date));
  const window=(lo,hi)=>days.filter(d=>{const delta=(end-Date.parse(d.date+'T00:00:00Z'))/86400000;return delta>=lo&&delta<=hi;});
  const recent=window(0,6),previous=window(7,13),mean=a=>a.length?a.reduce((s,x)=>s+x.weight,0)/a.length:null;
  const average=mean(recent),prevAverage=mean(previous);
  const delta=recent.length>=3&&previous.length>=3?average-prevAverage:null;
  return {average,count:recent.length,previousAverage:prevAverage,previousCount:previous.length,delta,days};
}
function sessionLoad(minutes,rpe) {
  if(minutes==null||rpe==null||minutes===''||rpe==='')return null;
  const m=Number(minutes),r=Number(rpe);
  if(!Number.isFinite(m)||!Number.isFinite(r)||m<1||m>600||r<0||r>10)throw new RangeError('Invalid session inputs');
  return m*r;
}

function coverageAudit(rows,knownIds) {
  if(!rows.length)return {status:'not-measured',covered:0,total:0,ratio:null};
  const known=new Set(knownIds);let total=0,covered=0;
  for(const r of rows){const n=Number(r.count);if(!Number.isInteger(n)||n<1)throw new RangeError('Counts must be positive integers');total+=n;if(known.has(r.equipmentId))covered+=n;}

}

function toggleCompare(id){if(!eq(id))return;if(state.selected.has(id))state.selected.delete(id);else if(state.selected.size<6)state.selected.add(id);else return flash(b('并排比较最多6项；完整表仍涵盖全部器材。','Compare up to six side by side; the full table still covers all equipment.'));
  $$('.count').forEach(el=>el.textContent=state.selected.size);
  if($('#equipment-results'))equipmentResults();else if((location.hash||'').startsWith('#compare'))compare();else renderPage();
}

ning substitute for a support or measurement tool.'))}</p>`}</div><p class="small muted">${h(b('仅按角色和动作交集筛选，不能保证相同肌肉刺激、关节耐受或适合康复。','Filtered by role and movement overlap; not a guarantee of identical stimulus, tolerance or rehabilitation suitability.'))}</p></section></div>${sourceBlock(e.sources,e.evidenceScope)}<p class="small muted">${h(e.reviewStatus)}</p>`;

class="table-wrap" tabindex="0"><table class="inventory-table"><thead><tr>${[tr('equipment'),tr('family'),tr('pattern'),tr('level'),tr('footprint'),tr('caution')].map(t=>`<th>${h(t)}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>`<tr><th scope="row"><a href="#equipment/${e.id}">${h(tx(e.name))}</a><small>${h(e.name.en)}</small></th><td>${h(tx(cat(e.category).name))}</td><td>${h(e.patterns.map(id=>tx(D.patterns[id])).join(' / '))}</td><td>${h(label(e.learning))}</td><td>${h(label(e.footprint))}</td><td>${h(tx(e.caution))}</td></tr>`).join('')}</tbody></table></div>`;

const gateText=()=>({urgent:b('停止训练建议匹配。出现胸痛、晕厥、进行性神经症状或其他严重异常，应及时联系当地急救或就医；本工具不能排除急症。','Plan matching is stopped. Chest pain, fainting, progressive neurological symptoms or other severe abnormalities warrant local emergency help or medical assessment; this tool cannot rule out an emergency.'),under18:b('未成年人：仅提供教育资料，不生成成人增肌或减脂处方。','Under 18: educational resources only, not adult hypertrophy or fat-loss prescriptions.'),older:b('65岁以上：本版仅提供人群教育与专业适配入口；不是建议停止活动。','Age 65+: this release provides population guidance and professional adaptation, not advice to stop activity.'),age:b('先填写有效年龄；本版自动模板适用范围为18–64岁。','Enter a valid age first. Automatic templates cover ages 18–64.'),screen:b('先回答两项安全问题。未回答不等于无风险。','Answer both safety questions first. Missing answers do not mean no risk.'),constraints:b('请检查目标、可用时间、场景与经验输入。','Check goal, available time, setting and experience.'),review:b('当前条件或查询触发专业评估分流：不生成个体训练建议。可阅读人群适配、康复边界及证据。','Your context or query requires professional assessment: no individual training recommendation is generated. Read population guidance, rehabilitation boundaries and evidence.')});
function gateMessage(gate){return gateText()[gate.reason]||gateText().review;}
function profileForm(){const p=state.profile;return `<form id="plan-form" class="profile-panel"><div class="inline-heading"><div><p class="eyebrow">MATCH, NOT DIAGNOSE</p><h2>${h(tr('start'))}</h2></div>${chip(b('无需注册','No registration'))}</div><p class="small muted">${h(b('只匹配已有模板，不生成医疗处方。所有信息仅留在当前页面；不会上传或自动保存健康档案。','Matches existing templates, not medical prescriptions. Inputs stay in this page; no upload or automatic health-profile storage.'))}</p><div class="form-grid"><label>${h(tr('goal'))}<select name="goal">${[['hypertrophy',tr('muscle')],['fat-loss',tr('fat')]].map(([id,n])=>`<option value="${id}" ${p.goal===id?'selected':''}>${h(n)}</option>`).join('')}</select></label><label>${h(tr('age'))}<input name="age" type="number" min="1" max="120" value="${h(p.age)}" placeholder="18–64" required></label><label>${h(tr('days'))}<select name="days">${[2,3,4,5,6,7].map(n=>`<option ${Number(p.days)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${h(tr('minutes'))}<select name="minutes">${[20,30,40,45,50,55,60,75,90].map(n=>`<option ${Number(p.minutes)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${h(tr('place'))}<select name="place">${['home','gym','outdoor'].map(id=>`<option value="${id}" ${p.place===id?'selected':''}>${h(label(id))}</option>`).join('')}</select></label><label>${h(b('训练经验','Experience'))}<select name="level">${['beginner','intermediate'].map(id=>`<option value="${id}" ${p.level===id?'selected':''}>${h(label(id))}</option>`).join('')}</select></label></div><div class="safety-fields"><label>${h(b('现在有胸痛、晕厥、严重气短、明显神经症状或其他紧急异常吗？','Do you currently have chest pain, fainting, severe breathlessness, significant neurological symptoms or another urgent abnormality?'))}<select name="urgent">${[['unknown',b('请选择','Select an answer')],['no',b('没有已知的上述症状','No known symptoms above')],['yes',b('有 / 可能有','Yes / possibly')]].map(([id,n])=>`<option value="${id}" ${p.urgent===id?'selected':''}>${h(n)}</option>`).join('')}</select></label><label>${h(b('是否有影响训练的疼痛、伤病、慢性病、孕产期或其他限制？','Any pain, injury, chronic illness, pregnancy/postpartum status or other limitation affecting training?'))}<select name="health">${[['unknown',b('请选择 / 不确定','Select / unsure')],['healthy',b('没有已知限制（不是医学体检结论）','No known limitation (not medical clearance)')],['pain',b('疼痛、损伤或术后','Pain, injury or postoperative')],['chronic',b('慢性疾病或运动相关用药','Chronic condition or exercise-related medication')],['pregnancy',b('孕期或产后','Pregnancy or postpartum')],['disability',b('需要活动或无障碍适配','Needs mobility / access adaptation')],['eating',b('进食障碍风险或体重追踪引发不适','Eating-disorder risk or distress from tracking')]].map(([id,n])=>`<option value="${id}" ${p.health===id?'selected':''}>${h(n)}</option>`).join('')}</select></label></div><details class="equipment-picker"><summary>${h(b('我实际能使用的器材','Equipment I can actually use'))} <span id="available-count">(${p.equipment.length})</span></summary><p class="small muted">${h(b('预设仅勾选清单，仍需你核实；“在健身房”不等于拥有全部器材。','Presets only check inventory boxes; verify them. Being at a gym does not imply access to every machine.'))}</p><div class="preset-buttons">${[['none',b('清空','Clear')],['db',b('一对哑铃','Dumbbells')],['band',b('长环形弹力带','Long loop band')],['machine',b('常见器械组合','Common machine set')]].map(([id,t])=>`<button type="button" class="small-button" data-preset="${id}">${h(t)}</button>`).join('')}</div>${D.categories.map(c=>`<fieldset><legend>${h(tx(c.name))}</legend><div class="check-grid">${D.equipment.filter(e=>e.category===c.id).map(e=>`<label><input type="checkbox" name="equipment" value="${e.id}" ${p.equipment.includes(e.id)?'checked':''}>${h(tx(e.name))}</label>`).join('')}</div></fieldset>`).join('')}</details><label>${h(b('补充搜索（可选，例如“减脂 3天 60分钟”）','Optional short query, e.g. “fat loss 3 days 60 min”'))}<input name="query" maxlength="240" value="${h(state.query)}" placeholder="${h(b('器材以勾选清单为准，症状词会触发分流','Equipment uses the checklist; symptom terms trigger assessment'))}"></label><button class="primary" type="submit">${h(tr('recommend'))} →</button><p class="small muted">${h(b('文本中的时间只会收紧约束；否定词不用于安全放行。没有专用否定语义分析，有症状字样仍可能保守拦截。','Time in text only tightens limits. Negation is not used for safety clearance; symptom terms may conservatively block even a negated phrase.'))}</p></form>`;}
function planCard(p,matched=false){return `<article class="plan-card"><div class="card-eyebrow">${h(p.goal==='hypertrophy'?tr('muscle'):tr('fat'))}<span>${p.days} ${h(b('天 / 周','days / week'))}</span></div><h3><a href="#plans/${p.id}">${h(tx(p.name))}</a></h3>${tags([p.minutes+' '+b('分钟 / 次','min / session'),label(p.level),p.partial?b('不完整起步模块','Partial starter'):b('含抗阻模块','Includes resistance')])}<p>${h(tx(p.notes))}</p><div class="card-bottom"><span class="small muted">${matched?h(b('符合当前硬约束','Matches hard constraints')):h(b('公开示例，非个人处方','Public example, not a prescription'))}</span><a class="read-link" href="#plans/${p.id}">${h(tr('details'))} →</a></div></article>`;}
function plans(){
  $('#main').innerHTML=sectionHead('PLAN LIBRARY',tr('plans'),b('先确认安全与资源，再选一份能完成的计划。','Screen safety and resources, then choose something feasible.'))+profileForm()+`<section id="recommend-results" aria-live="polite"></section><section id="all-plans"><div class="inline-heading"><h2>${h(b('公开模板库','Public template library'))}</h2><span>${D.plans.length} ${h(b('示例','examples'))}</span></div>${notice(b('以下是教育示例。能打开计划不表示你已通过筛查；特殊人群不直接套用。','These are educational examples. Opening one does not mean you passed screening; special populations should not copy them unchanged.'))}<div class="plan-grid">${D.plans.map(p=>planCard(p)).join('')}</div></section>`;

function recommendResults(){const r=state.recommended;if(!r)return;
  const target=$('#recommend-results');

function metrics(){

,step])=>`<label>${h(t)}<input name="${name}" type="number" min="${min}" max="${max}" step="${step}"></label>`).join('')}</div></details><label class="checkline"><input type="checkbox" name="eligible" required>${h(b('我符合上述记录适用条件；不将指标当作医学诊断。','I meet the tracker conditions above and will not use these values as medical diagnoses.'))}</label><label class="checkline"><input type="checkbox" name="consent" required>${h(b('允许把这条记录保存在此浏览器；共用设备上其他人可能看到。','Allow this record to be saved in this browser; others using a shared device may see it.'))}</label><div class="form-buttons"><button type="submit" class="primary">${h(b('保存本地记录','Save locally'))}</button><button type="button" id="calc-metrics" class="secondary">${h(b('只计算，不保存','Calculate only'))}</button></div><div id="metric-message" aria-live="polite"></div></form><div><section class="panel"><h2>${h(b('读取结果，不制造结论','Read values, not diagnoses'))}</h2><div id="metric-calculation"><p class="muted">${h(b('填入体重与身高可计算BMI；填入时长与整节RPE可算记录用负荷代理值。','Enter weight and height for BMI, or duration and session RPE for a logging proxy.'))}</p></div>${sourceLinks(['cdc-bmi','bia-2021','resistance-obesity'])}<p class="small muted">${h(b('时长×整节RPE为本项目展示的粗略负荷代理，任意单位；不是消耗热量、伤病预测或医疗恢复评分。','Duration × session RPE is a rough logging proxy in arbitrary units, not calories, injury prediction or a medical recovery score.'))}</p></section><section class="panel"><h2>${h(b('数据在你手里','Your data stays with you'))}</h2><p>${h(b('无需账号，不发送分析事件。健康记录只有勾选同意并保存时才写入浏览器。清空仅删除本项目记录，不影响语言与主题。','No account or analytics events. Health records are written only after consent and Save. Clearing removes this project’s logs, not language/theme preferences.'))}</p><div class="form-buttons"><button class="secondary" id="export-logs">${h(b('导出 JSON','Export JSON'))}</button><button class="danger-button" id="clear-logs">${h(b('删除全部记录','Delete all records'))}</button></div></section></div></div><section id="metric-history"></section>`;

function metricHistory(){const logs=getLogs();const s=weightSummary(logs);const chart=s.days.slice(-30);let plot='';
  if(chart.length){const width=700,height=230,min=Math.min(...chart.map(x=>x.weight)),max=Math.max(...chart.map(x=>x.weight)),range=Math.max(max-min,2);const start=Date.parse(chart[0].date),end=Date.parse(chart.at(-1).date);const point=x=>[40+(Date.parse(x.date)-start)/Math.max(end-start,86400000)*620,185-(x.weight-(min+max-range)/2)/range*145];plot=`<svg class="weight-chart" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="chart-title"><title id="chart-title">${h(b('体重记录，公斤；横轴为实际日期间隔，不对缺测插值。','Weight records in kilograms; actual date spacing, no imputed missing observations.'))}</title><path class="axis" d="M40 25v175h620"/><polyline class="trend-line" points="${chart.map(x=>point(x).join(',')).join(' ')}"/>${chart.map(x=>{const [px,py]=point(x);return `<circle class="trend-point" cx="${px}" cy="${py}" r="4"><title>${h(x.date)}: ${x.weight.toFixed(1)} kg</title></circle>`;}).join('')}<text x="40" y="222">${chart[0].date}</text><text x="660" y="222" text-anchor="end">${chart.at(-1).date}</text><text x="6" y="18">kg</text><text x="2" y="44">${((min+max+range)/2).toFixed(1)}</text><text x="2" y="189">${((min+max-range)/2).toFixed(1)}</text></svg>`;}

}
function search(){const q=state.query;const equip=searchItems(D.equipment,q,16),cards=searchItems(D.knowledge,q,12),intent=queryIntent(q);const planMatches=searchItems(D.plans,q,8);let candidates=intent.goal?D.plans.filter(p=>p.goal===intent.goal):planMatches;const risk=textRisk(q);
  $('#main').innerHTML=sectionHead('SEARCH THE ATLAS',b('搜索结果','Search results'),q||b('输入一个词，找到器材、计划和解释。','Enter a term to find equipment, plans and explanations.'))+(risk!=='none'?notice(gateMessage({status:risk==='urgent'?'urgent':'review',reason:risk==='urgent'?'urgent':'query'}),risk==='urgent'?'danger':'warn'):'')+`<div class="two-columns"><section><div class="inline-heading"><h2>${h(tr('equipment'))}</h2><span>${equip.length}</span></div><div class="search-list">${equip.map(e=>`<a href="#equipment/${e.id}"><span class="mini-art">${svg(e.category)}</span><span><strong>${h(tx(e.name))}</strong><small>${h(tx(e.use))}</small></span><span>↗</span></a>`).join('')||empty()}</div></section><section><div class="inline-heading"><h2>${h(tr('knowledge'))}</h2><span>${cards.length}</span></div><div class="knowledge-grid single">${cards.map(knowledgeCard).join('')||empty()}</div></section></div><section><div class="inline-heading"><h2>${h(tr('plans'))}</h2><a href="#plans">${h(tr('start'))} →</a></div>${risk==='none'?notice(b('下面只检索公开模板，尚未考虑你的安全与器材条件。请点击“匹配我的计划”完成筛查。','Below are public template search results, not yet screened for your safety or equipment. Use Find my plan to complete screening.'))+`<div class="plan-grid">${candidates.slice(0,6).map(p=>planCard(p)).join('')||empty()}</div>`:notice(b('当前查询触发安全分流，隐藏计划检索结果。','This query triggers safety routing; plan search results are hidden.'))}</section>`;bindKnowledge();
}
function renderPage(){const parts=location.hash.slice(1).split('/');const page=parts[0]||'home';let id='';try{id=decodeURIComponent(parts[1]||'');}catch{}
  const routes={home,equipment,compare,plans,knowledge,methods,populations,metrics,evidence,search};
  if(page==='equipment'&&id)equipmentDetail(id);else if(page==='plans'&&id)planDetail(id);else if(routes[page])routes[page]();else $('#main').innerHTML=empty(b('页面不存在，请使用导航。','Page not found; use navigation.'));
  document.title=(tr(page)!==page?tr(page):'Lift Atlas')+' · Lift Atlas';
}
function render(){layerNames={foundation:b('通识与目标','Foundations'),training:b('抗阻与有氧','Training'),nutrition:b('营养与体重管理','Nutrition'),metrics:b('测量与解释','Measurement'),recovery:b('疲劳与恢复','Recovery'),rehab:b('损伤与康复边界','Rehabilitation boundaries'),population:b('人群适配','Population adaptation')};shell();renderPage();}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
render();
